[project]
name = "conversation-synthesis"
version = "0.1.0"
description = "Multi-talker conversations synthesized with Kokoro: one voice per channel, for spatial-audio demos"
readme = "README.md"
license = "MIT"
# kokoro-onnx supports no Python past 3.13 yet.
requires-python = ">=3.10,<3.14"
dependencies = [
    "kokoro-onnx>=0.4",
    "numpy",
    "pyyaml",
    "scipy",
]

[project.scripts]
synthesize-conversation = "conversation_synthesis.synthesize:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
filterwarnings = ["error::RuntimeWarning"]
